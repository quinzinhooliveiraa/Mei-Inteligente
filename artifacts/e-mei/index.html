    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "name": "EasyMei",
      "url": "https://easymei.com.br",
      "logo": "https://easymei.com.br/logo.png",

      "sameAs": [
        "https://www.instagram.com/easy.mei/",
        "https://wa.me/5533912406270"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+55-33-91240-6270",
        "contactType": "customer service",
        "availableLanguage": "Portuguese",
        "areaServed": "BR"
      }
    }
    </script>

    <!-- JSON-LD: WebSite + Sitelinks Searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EasyMei",
      "url": "https://easymei.com.br",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://easymei.com.br/artigos?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication (pricing) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "applicationCategory": "BusinessApplication",

        {
          "@type": "Offer",
          "name": "Plano Gratuito",

        },
        {
          "@type": "Offer",
          "name": "Plano Pro",
          "price": "29.90",
          "priceCurrency": "BRL",
          "billingIncrement": "P1M"

      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "200"
      }
